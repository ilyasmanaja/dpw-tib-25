<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kel 4 Profile Badge Sederhana</title>
  <link rel="stylesheet" href="kelompok4.css">
</head>
<body>

  <div class="profile-card">
    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300" alt="Foto Profil" class="avatar">
    
    <div class="status-box">
      <span class="status-dot"></span>
      <span class="status-text">Online</span>
    </div>

    <h3 class="user-name">Sarah Jenkins</h3>
    <p class="user-role">Frontend Developer</p>
    <p class="user-bio">Suka membangun antarmuka web yang rapi, responsif, dan mudah digunakan.</p>

    <div class="action-buttons">
      <button type="button" class="btn btn-follow">Follow</button>
      <button type="button" class="btn btn-message">Message</button>
    </div>
  </div>

</body>
</html>
