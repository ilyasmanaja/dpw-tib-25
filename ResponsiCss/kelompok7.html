<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kel 7 Toast Alert Sederhana</title>
  <link rel="stylesheet" href="kelompok7.css">
</head>
<body>

  <div class="toast-card">
    <div class="toast-icon">&#10004;</div>

    <div class="toast-content">
      <h4 class="toast-title">Berhasil Tersimpan!</h4>
      <p class="toast-message">Data laporan praktikum Anda telah berhasil diunggah ke sistem.</p>
    </div>

    <button type="button" class="btn-close">&times;</button>
  </div>

</body>
</html>
