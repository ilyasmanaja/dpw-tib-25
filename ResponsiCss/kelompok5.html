<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kel 5 Pricing Card Sederhana</title>
  <link rel="stylesheet" href="kelompok5.css">
</head>
<body>

  <div class="pricing-card">
    <div class="card-badge">POPULAR</div>
    
    <h3 class="plan-title">Paket Pro</h3>
    
    <div class="price-box">
      <span class="price-number">Rp 99.000</span>
      <span class="price-period">/bulan</span>
    </div>

    <ul class="feature-list">
      <li>Akses Semua Fitur Premium</li>
      <li>Penyimpanan Cloud 50 GB</li>
      <li>Dukungan Prioritas 24/7</li>
      <li>Integrasi Domain Kustom</li>
    </ul>

    <button type="button" class="btn-cta">Pilih Paket</button>
  </div>

</body>
</html>
