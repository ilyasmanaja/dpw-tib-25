<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kel 2 Product Card Sederhana</title>
  <link rel="stylesheet" href="kelompok2.css">
</head>
<body>

  <div class="product-card">
    <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400" alt="Sepatu Merah" class="product-img">
    
    <span class="badge">Diskon 20%</span>
    <h3 class="product-name">Sepatu Sneaker Sport</h3>
    
    <div class="price-box">
      <span class="promo-price">Rp 200.000</span>
      <span class="old-price">Rp 250.000</span>
    </div>

    <button type="button" class="btn-cart">Tambah ke Keranjang</button>
  </div>

</body>
</html>
