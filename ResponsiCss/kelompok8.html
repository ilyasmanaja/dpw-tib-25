<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kel 8 Contact Form Sederhana</title>
  <link rel="stylesheet" href="kelompok8.css">
</head>
<body>

  <div class="contact-box">
    <h2>Hubungi Kami</h2>
    <p class="subtitle">Kirimkan pertanyaan atau saran Anda melalui formulir di bawah ini.</p>

    <form>
      <div class="form-group">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" placeholder="Masukkan nama Anda">
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="nama@email.com">
      </div>

      <div class="form-group">
        <label for="pesan">Pesan</label>
        <textarea id="pesan" rows="4" placeholder="Tulis pesan Anda di sini..."></textarea>
      </div>

      <button type="submit" class="btn-submit">Kirim Pesan</button>
    </form>
  </div>

</body>
</html>
