<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Sederhana Bootstrap</title>
    <!-- CDN Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-4">

    <!-- 1. TATA LETAK: Container membungkus konten di tengah -->
    <div class="container">
        <h3 class="mb-4">Tata Letak & Card (Bootstrap)</h3>

        <!-- 2. TATA LETAK: Row & Gap -->
        <div class="row g-3">

            <!-- Kolom: Layar HP full (12), Layar Laptop bagi 3 (col-md-4) -->
            <div class="col-12 col-md-4">
                <!-- 3. STRUKTUR CARD BOOTSTRAP -->
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Kartu 1</h5>
                        <p class="card-text">Konten kartu menggunakan class bawaan card .</p>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Kartu 2</h5>
                        <p class="card-text">Konten kartu kedua dengan ukuran yang sama.</p>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Kartu 3</h5>
                        <p class="card-text">Konten kartu ketiga dengan ukuran yang sama.</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>

</html>
